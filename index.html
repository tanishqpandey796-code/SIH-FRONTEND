          '<p><strong>Error:</strong> ' + message + '</p>' +
          '<p style="font-size:0.85rem;color:#666;">Line: ' + lineno + ' | Source: ' + source + '</p>' +
          '<p>Please ensure you are opening via <code>http://localhost:3000</code> or refresh the page.</p>' +
          '</div>';
      }
    };

    function CooperativeRadarCanvas() {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const width = 500;
        const height = 400;
        canvas.width = width * (window.devicePixelRatio || 1);
        canvas.height = height * (window.devicePixelRatio || 1);
        ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

        const centerX = width / 2;
        const centerY = height / 2;

        const nodes = [
          { name: 'Ramesh K.', role: '⚡ Electrician', dist: '1.2 km', x: centerX - 130, y: centerY - 65, color: '#F59E0B' },
          { name: 'Sunita D.', role: '🩺 Caregiver', dist: '1.8 km', x: centerX + 120, y: centerY - 70, color: '#10B981' },
          { name: 'Gurpreet S.', role: '🚰 Plumber', dist: '2.4 km', x: centerX + 130, y: centerY + 75, color: '#38BDF8' },
          { name: 'Mohd. Imran', role: '🪚 Carpenter', dist: '3.1 km', x: centerX - 120, y: centerY + 80, color: '#EC4899' },
          { name: 'Asha R.', role: '🍲 Housekeeper', dist: '0.9 km', x: centerX - 25, y: centerY - 125, color: '#A855F7' }
        ];

        let angle = 0;
        let packetT = 0;

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Radar Rings
          const maxR = 170;
          for (let r = 45; r <= maxR; r += 40) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Radar Sweep Gradient
          angle += 0.022;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, maxR, angle, angle + 0.38);
          ctx.closePath();
          const sweepGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxR);
          sweepGrad.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
          sweepGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');
          ctx.fillStyle = sweepGrad;
          ctx.fill();
          ctx.restore();

          // Connective Lines & Dynamic Payout Packets
          nodes.forEach((node, i) => {
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(node.x, node.y);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            const pProgress = (packetT + i * 0.2) % 1;
            const px = centerX + (node.x - centerX) * pProgress;
            const py = centerY + (node.y - centerY) * pProgress;
            ctx.beginPath();
            ctx.arc(px, py, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#F59E0B';
            ctx.shadowColor = '#F59E0B';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          packetT += 0.007;

          // Central Hub
          ctx.beginPath();
          ctx.arc(centerX, centerY, 24, 0, Math.PI * 2);
          const hubGrad = ctx.createLinearGradient(centerX - 24, centerY - 24, centerX + 24, centerY + 24);
          hubGrad.addColorStop(0, '#0F2C59');
          hubGrad.addColorStop(1, '#1E40AF');
          ctx.fillStyle = hubGrad;
          ctx.fill();
          ctx.strokeStyle = '#F59E0B';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#F59E0B';
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('सह', centerX, centerY);

          // Worker Nodes
          nodes.forEach(node => {
            ctx.beginPath();
            ctx.arc(node.x, node.y, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#0F172A';
            ctx.fill();
            ctx.strokeStyle = node.color;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = node.color;
            ctx.shadowBlur = 8;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Worker label badge
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            const textWidth = ctx.measureText(node.role).width;
            ctx.fillRect(node.x - textWidth / 2 - 5, node.y + 14, textWidth + 10, 16);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.strokeRect(node.x - textWidth / 2 - 5, node.y + 14, textWidth + 10, 16);

            ctx.fillStyle = '#F8FAFC';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(node.role, node.x, node.y + 26);
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="canvas-interactive-wrapper">
          <div className="canvas-header-bar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>

    function BookingCheckoutModal({ bookingDetails, onClose, onCompleteBooking }) {
      const [paymentMethod, setPaymentMethod] = useState('upi');
      const [isProcessing, setIsProcessing] = useState(false);
      const [bookingConfirmed, setBookingConfirmed] = useState(false);
      const [generatedInvoice, setGeneratedInvoice] = useState(null);

      const worker = bookingDetails.worker;
      const category = bookingDetails.category;
      
      const baseFare = worker.hourlyRate || category.basePrice || 350;
      const platformGst = Math.round(baseFare * 0.05);
      const totalAmount = baseFare + platformGst;

      const workerPayout = Math.round(baseFare * 0.90);
      const societyDividend = Math.round(baseFare * 0.05);
      const welfareContribution = Math.round(baseFare * 0.05);

      const handlePayAndConfirm = () => {
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          setBookingConfirmed(true);
          const invoice = {
            invoiceNo: `INV-SAHAKAR-${Math.floor(100000 + Math.random() * 900000)}`,
            bookingId: `BK-2026-${Math.floor(1000 + Math.random() * 9000)}`,
            date: new Date().toLocaleDateString('en-IN'),
            serviceName: category?.name || 'Household Service',
            workerName: worker.name,
            societyName: worker.society,
            societyRegNo: worker.societyRegNo,
            address: bookingDetails.address,
            totalAmount,
            workerPayout,
            societyDividend,
            welfareContribution,
            paymentMethod: paymentMethod.toUpperCase(),
            otp: Math.floor(1000 + Math.random() * 9000).toString()
          };
          setGeneratedInvoice(invoice);
          onCompleteBooking(invoice);
        }, 1500);
      };

      return (
        <div className="modal-overlay">
          <div className="modal-content" style={{ maxWidth: '650px' }}>
            <div className="modal-header">
              <div className="modal-title"><span>💳 Transparent Invoice & Payment</span></div>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>

            <div className="modal-body">
              {!bookingConfirmed ? (
                <>
                  <div style={{
                    background: 'var(--primary-glow)',
                    padding: '1.25rem',
                    borderRadius: '12px',
                    marginBottom: '1.5rem',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '1rem'
                  }}>
                    <img src={worker.photo} alt={worker.name} className="worker-avatar" />
                    <div>
                      <h4 style={{ fontSize: '1.1rem', fontWeight: 800 }}>{category?.name || 'Service Booking'}</h4>
                      <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                        Assigned Worker: <strong>{worker.name}</strong> ({worker.experience} exp)
                      </div>
                      <div style={{ fontSize: '0.8rem', color: 'var(--secondary)', fontWeight: 700 }}>
                        🏛️ {worker.society}
                      </div>
                    </div>
                  </div>

                  <h4 style={{ fontSize: '1rem', fontWeight: 800, marginBottom: '0.5rem' }}>Itemized Price Breakdown</h4>

                  <div className="invoice-breakdown-box">
                    <div className="invoice-row"><span>Base Service Fare</span><span>₹{baseFare}</span></div>
                    <div className="invoice-row"><span>Government GST (5%)</span><span>₹{platformGst}</span></div>
                    <div className="invoice-row total"><span>Total Amount Payable</span><span>₹{totalAmount}</span></div>

                    <div className="coop-split-badge">
                      <div style={{ fontWeight: 800, marginBottom: '0.25rem', display: 'flex', justifyContent: 'space-between' }}>
                        <span>🌱 Sahakar Fair-Wage Split Guarantee:</span>
                        <span>100% Transparent</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.5rem', fontSize: '0.75rem', marginTop: '0.5rem' }}>
                        <div><strong>Worker Payout (90%)</strong><br />₹{workerPayout} direct</div>
                        <div><strong>Society Share (5%)</strong><br />₹{societyDividend} dividend</div>
                        <div><strong>Welfare Fund (5%)</strong><br />₹{welfareContribution} insurance</div>
                      </div>
                    </div>
                  </div>

                  <h4 style={{ fontSize: '1rem', fontWeight: 800, marginBottom: '0.75rem' }}>Select Payment Mode</h4>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.75rem', marginBottom: '1.5rem' }}>
                    {['upi', 'card', 'netbanking'].map(method => (
                      <button

                          padding: '12px',

                          border: paymentMethod === method ? '2px solid var(--secondary)' : '1px solid var(--card-border)',

                      <strong>Cooperative Worker:</strong> {generatedInvoice?.workerName}<br />

                            value={custMobile}
                            onChange={(e) => setCustMobile(e.target.value.replace(/\D/g, ''))}
                            style={{
                              width: '100%',
                              boxSizing: 'border-box',
                              padding: '0.5rem 0.75rem',
                              borderRadius: '8px',
                              border: '1.5px solid #CBD5E1',
                              fontSize: '0.82rem',
                              outline: 'none'
                            }}
                          />
                        </div>
                      </div>

                      {custOtpSent && (
                        <div style={{ marginBottom: '0.45rem' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.15rem' }}>
                            <label style={{ fontSize: '0.75rem', fontWeight: 700, color: '#1E293B' }}>
                              Enter OTP
                            </label>
                            <span style={{ fontSize: '0.68rem', color: '#059669', fontWeight: 700 }}>
                              ✓ Demo OTP: 5291
                            </span>
                          </div>
                          <input
                            type="text"
                            placeholder="4-digit code"
                            maxLength="4"
                            value={custOtp}
                            onChange={(e) => setCustOtp(e.target.value)}
                            style={{
                              width: '100%',
                              boxSizing: 'border-box',
                              padding: '0.5rem 0.75rem',
                              borderRadius: '8px',
                              border: '1.5px solid #1D4ED8',
                              fontSize: '0.82rem',
                              outline: 'none',
                              background: '#EFF6FF'
                            }}
                          />
                        </div>
                      )}

                      <button
                        type="button"
                        onClick={() => {
                          if (!custMobile || custMobile.length < 10) {
                            alert('Please enter a valid 10-digit mobile number.');
                            return;
                          }
                          if (!custOtpSent) {
                            setCustOtpSent(true);
                            alert('Demo OTP sent: 5291');
                          } else {
                            onLogin({ name: `Resident (${custMobile})`, phone: custMobile, role: 'customer' }, 'customer');
                          }
                        }}
                        style={{
                          width: '100%',
                          padding: '0.6rem',
                          background: 'linear-gradient(135deg, #1D4ED8, #2563EB)',
                          color: 'white',
                          border: 'none',
                          borderRadius: '8px',
                          fontWeight: 700,
                          fontSize: '0.82rem',
                          cursor: 'pointer',
                          boxShadow: '0 3px 8px rgba(29, 78, 216, 0.25)',
                          marginBottom: '0.5rem'
                        }}
                      >
                        {custOtpSent ? 'Verify OTP & Enter' : 'Send OTP'}
                      </button>
                    </div>
                  ) : (
                    /* Email & Password Sub-form */
                    <form onSubmit={handleCustomerSubmit}>
                      <div style={{ marginBottom: '0.4rem' }}>
                        <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 700, color: '#1E293B', marginBottom: '0.15rem' }}>
                          Email Address
                        </label>
                        <input
                          type="email"
                          placeholder="Enter email address"
                          value={custEmail}
                          onChange={(e) => setCustEmail(e.target.value)}

                            boxSizing: 'border-box',

                            outline: 'none'
                          }}

                      </div>

                      <div style={{ marginBottom: '0.25rem' }}>
                        <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 700, color: '#1E293B', marginBottom: '0.15rem' }}>
                          Password
                        </label>
                        <div style={{ position: 'relative' }}>
                          <input
                            type={showCustPassword ? 'text' : 'password'}

                            value={custPassword}

                            style={{
                              width: '100%',
                              boxSizing: 'border-box',
                              padding: '0.5rem 2rem 0.5rem 0.75rem',
                              borderRadius: '8px',
                              border: '1.5px solid #CBD5E1',
                              fontSize: '0.82rem',
                              outline: 'none'
                            }}
                          />
                          <button
                            type="button"
                            onClick={() => setShowCustPassword(!showCustPassword)}
                            style={{
                              position: 'absolute',
                              right: '8px',
                              top: '50%',
                              transform: 'translateY(-50%)',
                              background: 'none',
                              border: 'none',
                              cursor: 'pointer',
                              fontSize: '0.75rem',
                              opacity: 0.7

                      <div style={{ textAlign: 'right', marginBottom: '0.4rem' }}>
                        <a href="#forgot" onClick={(e) => { e.preventDefault(); alert('Password reset link sent to your email.'); }} style={{ fontSize: '0.7rem', color: '#1D4ED8', textDecoration: 'none', fontWeight: 600 }}>
                          Forgot Password?
                        </a>
                      </div>

                      <button
                        type="submit"
                        style={{
                          width: '100%',
                          padding: '0.6rem',
                          background: '#0F2C59',
                          color: 'white',
                          border: 'none',
                          borderRadius: '8px',
                          fontWeight: 800,

                          cursor: 'pointer',
                          boxShadow: '0 3px 8px rgba(15, 44, 89, 0.2)',
                          marginBottom: '0.5rem'
                        }}
                      >
                        Login as Customer →
                      </button>
                    </form>
                  )}

                  {/* Google Login Button */}
                  <button
                    type="button"
                    onClick={() => handleGoogleLogin('customer')}
                    style={{
                      width: '100%',
                      padding: '0.48rem',
                      background: 'white',
                      border: '1px solid #CBD5E1',
                      borderRadius: '8px',
                      fontWeight: 700,
                      fontSize: '0.78rem',
                      color: '#1E293B',
                      cursor: 'pointer',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '0.45rem',
                      marginBottom: '0.5rem'
                    }}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                  </button>


                  {/* Create Account Link */}
                  <div style={{ textAlign: 'center', fontSize: '0.72rem', color: '#64748B', borderTop: '1px solid #F1F5F9', paddingTop: '0.35rem' }}>
                    New here?{' '}
                    <a href="#register" onClick={(e) => { e.preventDefault(); setIsRegistering(true); setRegOtpSent(false); setRegError(''); }} style={{ color: '#1D4ED8', fontWeight: 800, textDecoration: 'none' }}>
                      Create Account
                    </a>
                </div>
              )}
            </div>
          )}

              {/* TAB 2: COOPERATIVE SOCIETY LOGIN */}
              {activeTab === 'society' && (
                <div>
                  <div style={{ marginBottom: '0.65rem' }}>
                    <h3 style={{ fontSize: '1.15rem', fontWeight: 800, color: '#0F2C59', margin: 0 }}>
                      Cooperative Society Login
                    </h3>
                    <p style={{ fontSize: '0.72rem', color: '#64748B', margin: '1px 0 0 0' }}>
                      Manage workers, service orders & welfare fund
                    </p>
                  </div>

                  <form onSubmit={handleSocietySubmit}>
                    <div style={{ marginBottom: '0.4rem' }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 700, color: '#1E293B', marginBottom: '0.15rem' }}>
                        Email ID or Society Reg Number
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. DL-LAB-2018-992 or admin@sahakar.coop"
                        value={societyEmail}
                        onChange={(e) => setSocietyEmail(e.target.value)}
                        style={{
                          width: '100%',
                          boxSizing: 'border-box',
                          padding: '0.5rem 0.75rem',
                          borderRadius: '8px',
                          border: '1.5px solid #CBD5E1',
                          fontSize: '0.82rem',
                          outline: 'none'
                        }}
                      />
                    </div>

                    <div style={{ marginBottom: '0.25rem' }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 700, color: '#1E293B', marginBottom: '0.15rem' }}>
                        Password
                      </label>
                      <div style={{ position: 'relative' }}>
                        <input
                          type={showSocietyPassword ? 'text' : 'password'}
                          placeholder="Enter society password"
                          value={societyPassword}
                          onChange={(e) => setSocietyPassword(e.target.value)}
                          style={{
                            width: '100%',
                            boxSizing: 'border-box',
                            padding: '0.5rem 2rem 0.5rem 0.75rem',
                            borderRadius: '8px',
                            border: '1.5px solid #CBD5E1',
                            fontSize: '0.82rem',
                            outline: 'none'
                          }}
                        />
                        <button
                          type="button"
                          onClick={() => setShowSocietyPassword(!showSocietyPassword)}
                          style={{
                            position: 'absolute',
                            right: '8px',
                            top: '50%',
                            transform: 'translateY(-50%)',
                            background: 'none',
                            border: 'none',
                            cursor: 'pointer',
                            fontSize: '0.75rem',
                            opacity: 0.7
                          }}
                        >
                          {showSocietyPassword ? '👁️' : '👁️‍🗨️'}
                        </button>
                      </div>
                    </div>

                    <div style={{ textAlign: 'right', marginBottom: '0.4rem' }}>
                      <a href="#forgot" onClick={(e) => { e.preventDefault(); alert('Call 1800-11-SAHAKAR for password reset.'); }} style={{ fontSize: '0.7rem', color: '#1D4ED8', textDecoration: 'none', fontWeight: 600 }}>
                        Forgot Password?
                      </a>
                    </div>

                    <button
                      type="submit"
                      style={{
                        width: '100%',
                        padding: '0.6rem',
                        background: 'linear-gradient(135deg, #0F2C59, #1D4ED8)',
                        color: 'white',
                        border: 'none',
                        borderRadius: '8px',
                        fontWeight: 800,
                        fontSize: '0.82rem',
                        cursor: 'pointer',
                        boxShadow: '0 3px 8px rgba(15, 44, 89, 0.25)',
                        marginBottom: '0.5rem'
                      }}
                    >
                      Login as Cooperative Society →
                    </button>
                  </form>

                  {/* Google Workspace Button */}
                  <button
                    type="button"
                    onClick={() => handleGoogleLogin('admin')}
                    style={{
                      width: '100%',
                      padding: '0.48rem',
                      background: 'white',
                      border: '1px solid #CBD5E1',
                      borderRadius: '8px',
                      fontWeight: 700,
                      fontSize: '0.78rem',
                      color: '#1E293B',
                      cursor: 'pointer',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '0.45rem',
                      marginBottom: '0.5rem'
                    }}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google Workspace Sign in</span>
                  </button>


                  {/* Register Society Link */}
                  <div style={{ textAlign: 'center', fontSize: '0.72rem', color: '#64748B', borderTop: '1px solid #F1F5F9', paddingTop: '0.35rem' }}>
                    New Cooperative Society?{' '}
                    <a href="#register-society" onClick={(e) => { e.preventDefault(); onLogin({ name: 'Affiliated Society Admin', role: 'admin' }, 'admin'); }} style={{ color: '#0F2C59', fontWeight: 800, textDecoration: 'none' }}>
                      Register Now
                    </a>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 4. Urgent Emergency Booking Bar (Directly below Login Card) */}
          <div className="container" style={{ maxWidth: '980px', width: '100%', margin: '0.2rem auto', padding: '0 1rem', flexShrink: 0 }}>
            <div style={{
              background: 'linear-gradient(135deg, #FEF2F2, #FFF1F2)',
              border: '1.5px solid #FECDD3',
              borderRadius: '12px',
              padding: '0.5rem 1.2rem',
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              gap: '0.75rem',
              boxShadow: '0 3px 10px rgba(220, 38, 38, 0.05)'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <div style={{
                  width: '32px',
                  height: '32px',
                  borderRadius: '50%',
                  background: '#FEE2E2',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '1.1rem',
                  flexShrink: 0
                }}>
                  🚨
                </div>
                <div>
                  <div style={{ fontWeight: 800, color: '#991B1B', fontSize: '0.82rem', lineHeight: 1.1 }}>
                    Need Urgent Emergency Service?
                  </div>
                  <div style={{ fontSize: '0.68rem', color: '#7F1D1D' }}>
                    Book verified emergency workers instantly without logging in.
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', flexShrink: 0 }}>
                <button
                  type="button"
                  onClick={() => onEmergencyDirect('⚡ Emergency Short Circuit / MCB Trip')}
                  style={{
                    background: 'white',
                    border: '1px solid #FCA5A5',
                    padding: '4px 10px',
                    borderRadius: '14px',
                    fontSize: '0.72rem',
                    fontWeight: 700,
                    color: '#B91C1C',
                    cursor: 'pointer'
                  }}
                >
                  ⚡ Electrician
                </button>
                <button
                  type="button"
                  onClick={() => onEmergencyDirect('🚰 Water Pipe Burst / Leakage')}
                  style={{
                    background: 'white',
                    border: '1px solid #FCA5A5',
                    padding: '4px 10px',
                    borderRadius: '14px',
                    fontSize: '0.72rem',
                    fontWeight: 700,
                    color: '#B91C1C',
                    cursor: 'pointer'
                  }}
                >
                  🚰 Plumber
                </button>
                <button
                  type="button"
                  onClick={() => onEmergencyDirect(null)}
                  style={{
                    background: 'linear-gradient(135deg, #DC2626, #B91C1C)',
                    color: 'white',
                    border: 'none',
                    padding: '6px 14px',
                    borderRadius: '8px',
                    fontWeight: 800,
                    fontSize: '0.78rem',
                    cursor: 'pointer',
                    boxShadow: '0 3px 8px rgba(220, 38, 38, 0.3)',
                    whiteSpace: 'nowrap'
                  }}
                >
                  Book Now (Without Login) ⚡
                </button>
              </div>
            </div>
          </div>

          {/* 5. Minimal Footer Note */}
          <div style={{ textAlign: 'center', color: '#94A3B8', fontSize: '0.68rem', flexShrink: 0 }}>
            © 2026 Ministry of Cooperation, Govt of India • Labour Cooperative Digital Marketplace (SIH26089)
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeRole, setActiveRole] = useState('customer');
      const [userBookings, setUserBookings] = useState(INITIAL_BOOKINGS);

      const handleLogin = (user, role = 'customer') => {
        setCurrentUser(user);
        setActiveRole(role);
        setIsLoggedIn(true);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser(null);
      };

      const handleEmergencyDirect = (serviceName) => {
        setCurrentUser({ name: 'Emergency Citizen', role: 'customer' });
        setActiveRole('customer');
        setIsLoggedIn(true);
        setSosModalOpen(true);
      };

      const [selectedCategory, setSelectedCategory] = useState(null);
      const [geoMatchingOpen, setGeoMatchingOpen] = useState(false);
      
      const [pendingBookingDetails, setPendingBookingDetails] = useState(null);
      const [checkoutModalOpen, setCheckoutModalOpen] = useState(false);
      
      const [sosModalOpen, setSosModalOpen] = useState(false);
      const [calculatorOpen, setCalculatorOpen] = useState(false);

      const handleSelectCategory = (category) => {
        setSelectedCategory(category);
        setGeoMatchingOpen(true);
      };

      const handleSelectWorker = (bookingPayload) => {
        setGeoMatchingOpen(false);
        setPendingBookingDetails(bookingPayload);
        setCheckoutModalOpen(true);
      };

      const handleCompleteBooking = (invoice) => {
        const newBooking = {
          id: invoice.bookingId,
          serviceName: invoice.serviceName,
          workerName: invoice.workerName,
          workerRole: 'Cooperative Specialist',
          society: invoice.societyName,
          date: invoice.date,
          time: 'Instant / Scheduled',
          status: 'Confirmed',
          address: invoice.address,
          totalAmount: invoice.totalAmount,
          workerPayout: invoice.workerPayout,
          societyDividend: invoice.societyDividend,
          welfareContribution: invoice.welfareContribution,
          paymentStatus: `Paid via ${invoice.paymentMethod}`,
          otp: invoice.otp
        };
        setUserBookings([newBooking, ...userBookings]);
      };

      if (!isLoggedIn) {
        return (
          <LoginPage 
            onLogin={handleLogin} 
            onEmergencyDirect={handleEmergencyDirect} 
          />
        );
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Header
            activeRole={activeRole}
            setActiveRole={setActiveRole}
            onOpenSOS={() => setSosModalOpen(true)}
            bookingCount={userBookings.length}
            currentUser={currentUser}
            onLogout={handleLogout}
          />

          <main style={{ flex: 1 }}>
            {activeRole === 'customer' && (
              <>
                <HeroSection
                  onExploreServices={() => {
                    const catalogEl = document.getElementById('services-catalog');
                    if (catalogEl) catalogEl.scrollIntoView({ behavior: 'smooth' });
                  }}
                  onOpenCalculator={() => setCalculatorOpen(true)}
                  onSelectCategoryById={(catId) => {
                    const foundCat = SERVICE_CATEGORIES.find(c => c.id === catId);
                    if (foundCat) handleSelectCategory(foundCat);
                  }}
                />

                {userBookings.length > 0 && (
                  <div className="container" style={{ margin: '1.5rem auto 0 auto' }}>
                    <div style={{
                      background: 'var(--card-bg)',
                      border: '2px solid var(--secondary)',
                      borderRadius: '16px',
                      padding: '1.25rem 1.75rem',
                      boxShadow: 'var(--shadow-md)'
                    }}>
                      <h3 style={{ fontSize: '1.1rem', fontWeight: 800, marginBottom: '0.75rem', color: 'var(--secondary)', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <span>📋 Your Active Cooperative Bookings ({userBookings.length})</span>
                      </h3>

                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1rem' }}>
                        {userBookings.map((b) => (
                          <div key={b.id} style={{ background: '#F8FAFC', border: '1px solid var(--card-border)', borderRadius: '12px', padding: '1rem' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                              <strong style={{ fontSize: '0.95rem' }}>{b.serviceName}</strong>
                              <span style={{ background: '#D1FAE5', color: '#065F46', padding: '2px 8px', borderRadius: '10px', fontSize: '0.75rem', fontWeight: 800 }}>{b.status}</span>
                            </div>
                            <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                              Worker: <strong>{b.workerName}</strong> | 🏛️ {b.society}
                            </div>
                            <div style={{ fontSize: '0.8rem', marginTop: '0.4rem', color: 'var(--primary)', fontWeight: 700 }}>
                              🔑 Job OTP: <span style={{ background: '#FEF3C7', padding: '2px 6px', borderRadius: '4px' }}>{b.otp}</span> | Paid ₹{b.totalAmount}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <ServiceCatalog onSelectCategory={handleSelectCategory} />
              </>
            )}

            {(activeRole === 'admin' || activeRole === 'worker') && (
              <AdminDashboard initialTab={activeRole === 'worker' ? 'workspace' : 'verification'} />
            )}
          </main>

          {geoMatchingOpen && (
            <GeoMatchingModal
              selectedCategory={selectedCategory}
              onClose={() => setGeoMatchingOpen(false)}
              onSelectWorker={handleSelectWorker}
            />
          )}

          {checkoutModalOpen && pendingBookingDetails && (
            <BookingCheckoutModal
              bookingDetails={pendingBookingDetails}
              onClose={() => setCheckoutModalOpen(false)}
              onCompleteBooking={handleCompleteBooking}
            />
          )}

          {sosModalOpen && (
            <EmergencySOSModal
              onClose={() => setSosModalOpen(false)}
              onConfirmSOS={() => {}}
            />
          )}

          {calculatorOpen && (
            <FairWageCalculator onClose={() => setCalculatorOpen(false)} />
          )}

          <Footer />
        </div>
      );
    }

    // =========================================================================
    // RENDER
    // =========================================================================

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
